name: iOS Simulator Diagnostics
on:
  push:
    branches: ["diagnostics/ios-simulator-20261119"]
    paths: [".github/workflows/ios-simulator-diagnostics.yml"]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Read video-test crash report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p crash-input crash-export
          gh run download 44541777988 --name moyu-ios-logs-44541777988 --dir crash-input
          xcrun xcresulttool get test-results summary --path crash-input/NativeTests.xcresult
          xcrun xcresulttool export diagnostics --path crash-input/NativeTests.xcresult --output-path crash-export
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path("crash-export")
          for item in list(root.rglob("*.zip")):
              with zipfile.ZipFile(item) as z:
                  for name in z.namelist():
                      if name.endswith((".ips",".crash")):
                          text=z.read(name).decode("utf-8","replace")
                          if "MoyuCamera" in text:
                              print("CRASH FILE",name)
                              print(text[:45000])
          for item in root.rglob("*"):
              if item.is_file() and item.suffix in (".ips",".crash"):
                  text=item.read_text(errors="replace")
                  if "MoyuCamera" in text:
                      print("CRASH FILE",item)
                      print(text[:45000])
          PY
