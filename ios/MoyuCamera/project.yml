name: MoyuCamera
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    "ARCHS[sdk=iphoneos*]": arm64
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
targets:
  MoyuCamera:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: MoyuCamera
        CFBundleName: MoyuCamera
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 导入照片和视频，在本机编辑水印。
        NSPhotoLibraryAddUsageDescription: 将带水印的照片和视频保存到系统相册。
        NSCameraUsageDescription: 使用相机拍照和录像，制作水印照片与视频。
        NSMicrophoneUsageDescription: 录像时可选择录制原声。
        NSLocationWhenInUseUsageDescription: 点击定位时获取当前地址，地址仍可手动编辑。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moyu.native.camera
        PRODUCT_NAME: MoyuCamera
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0.1"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
  MoyuCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NativeTests
    dependencies:
      - target: MoyuCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.moyu.native.camera.tests
schemes:
  MoyuCamera:
    build:
      targets:
        MoyuCamera: all
    test:
      targets:
        - MoyuCameraTests
    run:
      config: Debug
    archive:
      config: Release
